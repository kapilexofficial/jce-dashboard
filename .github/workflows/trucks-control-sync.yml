name: Trucks Control → Supabase sync

on:
  schedule:
    # A cada 30 minutos. Cron UTC. GitHub Actions pode atrasar até alguns minutos
    # em horários de pico (sem garantia de pontualidade no plano free).
    - cron: "*/30 * * * *"
  workflow_dispatch: # Permite trigger manual pela UI do GitHub

concurrency:
  group: trucks-control-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call sync endpoint
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::DASHBOARD_URL ou CRON_SECRET não configurado em GitHub Secrets"
            exit 1
          fi

          echo "Calling $DASHBOARD_URL/api/cron/trucks-control-sync"

          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 540 \
            "$DASHBOARD_URL/api/cron/trucks-control-sync")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "HTTP $status"
          echo "$body" | jq . || echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Sync failed with HTTP $status"
            exit 1
          fi
